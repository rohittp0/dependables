name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      modules:
        description: "Comma-separated Gradle modules"
        required: true
        type: string

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.value }}

    steps:
      - id: modules
        shell: bash
        run: |
          value=$(echo "${{ inputs.modules }}" \
            | tr ',' '\n' \
            | tr -d ' ' \
            | grep -v '^$' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "value=$value" >> "$GITHUB_OUTPUT"

  publish:
    needs: detect
    name: Publish ${{ matrix.module }}
    runs-on: ubuntu-latest

    concurrency:
      group: r2-release-${{ matrix.module }}
      cancel-in-progress: false

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJson(needs.detect.outputs.modules) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify publishing configuration
        shell: bash
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          required=(
            R2_ENDPOINT
            R2_BUCKET
            R2_PUBLIC_URL
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            SIGNING_KEY
            SIGNING_KEY_ID
            SIGNING_KEY_PASSWORD
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing publishing value: $name"
              exit 1
            fi
          done

      - name: Reject an existing release
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          module="$MODULE"

          if [[ ! "$module" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || [[ ! -f "$module/build.gradle.kts" ]]; then
            echo "::error::Unknown Gradle module: $module"
            exit 1
          fi

          version=$(sed -nE \
            's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
            "$module/build.gradle.kts")

          if [[ -z "$version" ]] || [[ "$version" == *$'\n'* ]]; then
            echo "::error::Could not determine one version for module: $module"
            exit 1
          fi

          group_path="com/rohittp/dependables"
          key="${group_path}/${module}/${version}/${module}-${version}.pom"

          count=$(aws \
            --endpoint-url "$R2_ENDPOINT" \
            s3api list-objects-v2 \
            --bucket "$R2_BUCKET" \
            --prefix "$key" \
            --max-keys 1 \
            --query KeyCount \
            --output text)

          if [[ "$count" != "0" ]]; then
            echo "::error::Release already exists: $key"
            exit 1
          fi

      - name: Build and publish
        env:
          MODULE: ${{ matrix.module }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew \
            ":${MODULE}:build" \
            ":${MODULE}:publishAllPublicationsToR2Repository"
